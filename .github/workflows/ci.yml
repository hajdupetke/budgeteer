name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: budgeteer-test
          POSTGRES_DB: budgeteer_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d budgeteer_ci_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:budgeteer-test@localhost:5432/budgeteer_ci_test
      TEST_DATABASE_URL: postgresql://postgres:budgeteer-test@localhost:5432/budgeteer_ci_test
      AUTH_SECRET: ci-only-secret-not-used-for-real-accounts
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm build
