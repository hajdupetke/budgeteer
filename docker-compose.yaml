services:
  db:
    image: postgres:16
    container_name: budgeteer_db
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: budgeteer
    volumes:
      - budgeteer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budgeteer"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  budgeteer-data:
